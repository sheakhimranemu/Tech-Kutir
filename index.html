<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tech Kutir AI">

  <title>TECH KUTIR AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    header {
      padding: 18px 15px;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 86%;
      padding: 12px 15px;
      margin-bottom: 14px;
      border-radius: 15px;
      line-height: 1.55;
      font-size: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #e9eefc;
      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-right: auto;
      background: #f1f1f1;
      border-bottom-left-radius: 5px;
    }

    .welcome {
      text-align: center;
      margin: 35px auto;
      color: #777;
      line-height: 1.7;
    }

    .welcome strong {
      color: #222;
      font-size: 19px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }

    textarea {
      flex: 1;
      min-width: 0;
      height: 48px;
      resize: none;
      border: 1px solid #d5d5d5;
      border-radius: 13px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #999;
    }

    #send {
      width: 72px;
      border: none;
      border-radius: 13px;
      background: #111;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
    }

    .new-chat {
      margin: 9px 10px 0;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 9px 5px 12px;
      font-size: 12px;
      color: #888;
      border-top: 1px solid #eee;
      background: #fff;
    }

    footer strong {
      color: #555;
    }

    @media (max-width: 500px) {
      header {
        font-size: 19px;
      }

      .message {
        max-width: 91%;
      }

      #send {
        width: 65px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      TECH KUTIR AI
    </header>

    <button class="new-chat" id="newChat">
      New Chat
    </button>

    <div id="chat">
      <div class="welcome">
        <strong>Welcome to Tech Kutir AI</strong><br>
        Ask me anything.
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="message"
        placeholder="Type your message..."
        autocomplete="off"
      ></textarea>

      <button id="send">
        SEND
      </button>
    </div>

    <footer>
      Designed &amp; Developed by <strong>Sheakh Imran</strong><br>
      © 2026 Tech Kutir
    </footer>

  </div>

<script>

const API_URL =
  "https://techkutir-ai-api.sheakhimranemu.workers.dev/";

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const send = document.getElementById("send");
const newChat = document.getElementById("newChat");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  const text = message.value.trim();

  if (!text || send.disabled) {
    return;
  }

  addMessage(text, "user");

  message.value = "";
  send.disabled = true;
  send.textContent = "...";

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.textContent = "Thinking...";
  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {
      addMessage(
        "Error: " + (data.error || "Something went wrong."),
        "ai"
      );
    } else {
      addMessage(
        data.reply || "No response received.",
        "ai"
      );
    }

  } catch (error) {

    loading.remove();

    addMessage(
      "Connection error. Please try again.",
      "ai"
    );

  }

  send.disabled = false;
  send.textContent = "SEND";
}

send.addEventListener("click", sendMessage);

message.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

newChat.addEventListener("click", function() {

  chat.innerHTML = `
    <div class="welcome">
      <strong>Welcome to Tech Kutir AI</strong><br>
      Ask me anything.
    </div>
  `;

  message.focus();

});

</script>

</body>
</html>
